name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis,msi
            arch: x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: dmg
            arch: arm64
          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: dmg
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-sdl.ps1
      - if: runner.os == 'macOS'
        run: bash scripts/fetch-sdl-macos.sh ${{ matrix.arch }}
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
        working-directory: apps/desktop
      - run: cargo build --release --locked --target ${{ matrix.target }} -p horiplay-cli -p horiplay-signaling
      - run: node scripts/package.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish explicitly incomplete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --target "${GITHUB_SHA}" --prerelease --title "HoriPlay ${GITHUB_REF_NAME} · Controller Input Alpha" --notes-file docs/RELEASE.md

