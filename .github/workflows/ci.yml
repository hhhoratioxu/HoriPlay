name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-sdl.ps1
      - if: runner.os == 'macOS'
        run: bash scripts/fetch-sdl-macos.sh "$(uname -m)"
      - run: cargo check -p horiplay-desktop --locked
      - name: Load native SDL runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HORIPLAY_SDL3 = (Resolve-Path ./runtime/SDL3.dll).Path
          cargo run --locked -p horiplay-cli -- engine-test --seconds 2
      - name: Load native SDL runtime on macOS
        if: runner.os == 'macOS'
        run: HORIPLAY_SDL3="$PWD/runtime/libSDL3.0.dylib" cargo run --locked -p horiplay-cli -- engine-test --seconds 2

